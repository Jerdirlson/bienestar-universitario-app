# Postgres de Raíz.
#
# Esta máquina aloja además Acueducto Rural UPB en producción. Todo aquí está
# nombrado con el prefijo `raiz` y limitado en recursos para que, pase lo que
# pase con nuestro servicio, el suyo no se vea afectado.
#
#   docker compose -f /srv/raiz/docker-compose.yml up -d
#
# Ver deploy/README.md antes de la primera vez.

name: raiz

services:
  db:
    image: postgres:16-alpine
    container_name: raiz-db
    restart: unless-stopped

    # SIN sección `ports`, y es deliberado.
    # Postgres queda accesible solo desde la red raiz_net, nunca desde internet.
    # Publicar 5432 expondría la base entera; las políticas de seguridad
    # protegen de un cliente autenticado, no de alguien que llegue a la máquina.

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raiz}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      # Falla el arranque si la contraseña es débil o el volumen ya existía con
      # otra: preferimos no arrancar a arrancar mal.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    # Ajuste para una máquina pequeña y compartida. Sin esto Postgres asume que
    # tiene el servidor para él solo y reserva de más.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=1000   # avisa de consultas lentas (>1s)

    # Techo duro de recursos. Es la garantía concreta de que Raíz no puede
    # ahogar al acueducto: aunque tengamos una fuga de memoria, el kernel mata
    # nuestro contenedor y no el suyo.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - raiz_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-raiz}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"   # sin esto los logs crecen sin límite y llenan el disco
        max-file: "3"

  api:
    build:
      context: ../api
    container_name: raiz-api
    restart: unless-stopped

    # Tampoco se publica al host: nginx lo alcanzará por nombre dentro de
    # raiz_net. Nada de Raíz debe escuchar directamente en la red del servidor.

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${APP_DB_USER:-raiz_app}:${APP_DB_PASSWORD:?falta APP_DB_PASSWORD en .env}@db:5432/${POSTGRES_DB:-raiz}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-upb.edu.co}

    # No arranca hasta que la base responda. Sin esto el API se levanta, falla
    # las primeras peticiones y se reinicia en bucle mientras Postgres inicia.
    depends_on:
      db:
        condition: service_healthy

    mem_limit: 256m
    cpus: 0.5

    networks:
      - raiz_net

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: ngrok/ngrok:3
    container_name: raiz-tunnel
    restart: unless-stopped
    command: ["http", "http://api:3000", "--url=${NGROK_DOMAIN:-}", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    # Túnel de ngrok con dominio estático gratis: sale hacia afuera, no abre
    # ningún puerto en el host ni toca el nginx del acueducto, y la URL es
    # FIJA (a diferencia del túnel rápido de Cloudflare que usábamos, cuya
    # URL cambiaba en cada reinicio y dejaba los APK apuntando a la nada).
    # Da HTTPS de punta a punta hasta ngrok. NGROK_AUTHTOKEN y NGROK_DOMAIN
    # viven solo en el .env del servidor. Sin defaults obligatorios (:?) a
    # propósito: api/run-tests.sh usa este mismo archivo y solo levanta db.

    depends_on:
      api:
        condition: service_healthy

    mem_limit: 128m
    cpus: 0.25

    networks:
      - raiz_net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    # Configurable para poder estrenar una base limpia sin tocar la anterior
    # (en la VPS, PG_VOLUME=raiz_pgdata_v2 deja intacto el raiz_pgdata viejo).
    name: ${PG_VOLUME:-raiz_pgdata}

networks:
  raiz_net:
    name: raiz_net

name: Publicar actualización

# Cada push a master publica una actualización OTA que llega a los teléfonos la
# próxima vez que abran la app. No hay que reinstalar nada.
#
# Requiere un secreto EXPO_TOKEN en el repositorio:
#   Settings → Secrets and variables → Actions → New repository secret
#   El token se genera en https://expo.dev/settings/access-tokens
#
# Mientras ese secreto no exista, las pruebas siguen corriendo y la publicación
# se omite con un aviso, sin marcar el push en rojo.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Si llegan dos pushes seguidos, se publica solo el último.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cubre rachas, fechas, validación, almacenamiento y —lo más importante
      # aquí— que los recursos de crisis sigan teniendo destino. Un botón muerto
      # en el SOS es el peor fallo posible, y el despliegue automático lo
      # repartiría a todos los teléfonos sin que nadie lo revise.
      - name: Pruebas
        run: npm test

  publicar:
    name: Publicar OTA
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      # Dos requisitos, no uno. Sin EXPO_API_URL la actualización saldría con
      # API_URL = null (el .env no está en el repositorio) y ningún teléfono
      # podría iniciar sesión: es peor publicar eso que no publicar nada.
      # La URL va en Settings → Secrets and variables → Actions → Variables.
      - name: ¿Hay token de Expo y URL del API?
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN no está configurado todavía. Las pruebas pasaron; se omite la publicación."
          elif [ -z "$EXPO_API_URL" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta la variable EXPO_PUBLIC_API_URL del repositorio. Se omite la publicación para no mandar una app que no puede iniciar sesión."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.listo == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.listo == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.listo == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: steps.token.outputs.listo == 'true'

      # Desde eas-cli 18.0.5, `eas update` exige `--environment` explícito en
      # proyectos SDK >= 55 (antes lo inferían solo). No usamos las variables
      # de entorno alojadas por EAS (`eas env:create`) — este proyecto pasa
      # EXPO_PUBLIC_API_URL directo por variable de shell, como siempre — y
      # eas-cli solo agrega encima las que estén configuradas del lado del
      # servidor para ese entorno (aquí, ninguna), así que --environment no
      # pisa nada de lo que ya se exporta en este paso.
      - name: Publicar en el canal production
        if: steps.token.outputs.listo == 'true'
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          # Por variable y no interpolado en el comando: un mensaje de commit con
          # comillas o `$()` rompería (o ejecutaría) el shell.
          MENSAJE: ${{ github.event.head_commit.message }}
        run: eas update --branch production --environment production --message "$(printf '%s' "$MENSAJE" | head -n 1)" --non-interactive

      # Expo Go (para probar en iPhone sin compilar un binario nuevo) solo
      # carga actualizaciones publicadas con runtime `exposdk:<versión del
      # SDK>` — nunca el runtime `appVersion` (1.1.0) que usan los binarios
      # nativos (ver app.config.js). Por eso se publica la misma actualización
      # una segunda vez, hacia un canal aparte (`expo-go`), con EXPO_GO=1 para
      # que app.config.js resuelva ese runtime distinto. Mismo API URL y
      # mismo mensaje de commit que el paso de arriba, para que ambos canales
      # queden sincronizados con el mismo código.
      - name: Publicar en el canal expo-go (para probar en Expo Go)
        if: steps.token.outputs.listo == 'true'
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          MENSAJE: ${{ github.event.head_commit.message }}
          EXPO_GO: '1'
        run: eas update --branch expo-go --environment production --message "$(printf '%s' "$MENSAJE" | head -n 1)" --non-interactive
